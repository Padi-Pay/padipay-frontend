name: WhatsApp Bot CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'whatsappbot/**'
      - '.github/workflows/whatsappbot-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'whatsappbot/**'
      - '.github/workflows/whatsappbot-ci.yml'

jobs:
  install-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./whatsappbot

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        
    - name: Install Dependencies
      run: npm install
